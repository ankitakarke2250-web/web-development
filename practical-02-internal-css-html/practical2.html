
<!DOCTYPE html>
<html>
<head>
    <title>Internal CSS Practical</title>

    <style>
        body {
            background-color: lightyellow;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        h1 {
            color: blue;
            font-size: 36px;
        }

        p {
            color: green;
            font-size: 20px;
        }

        h2 {
            color: red;
        }

        button {
            background-color: blue;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
        }
    </style>
</head>

<body>

    <h1>Welcome to My Webpage</h1>

    <p>This webpage uses Internal CSS.</p>

    <h2>About Me</h2>

    <p>I am a Computer Science Student.</p>

    <button>Click Me</button>

</body>
</html>
