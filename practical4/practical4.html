
<!DOCTYPE html>
<html>
<head>
    <title>CSS Styling</title>

    <style>
        h1 {
            color: blue;
            text-align: center;
            font-size: 36px;
        }

        h2 {
            color: green;
            font-family: Arial, sans-serif;
        }

        p {
            color: #333333;
            font-size: 18px;
            font-family: Arial, sans-serif;
            line-height: 1.6;
            background-color: lightyellow;
            padding: 10px;
        }
    </style>
</head>
<body>

    <h1>Welcome to CSS</h1>
    <h2>Introduction to CSS</h2>

    <p>
        CSS stands for Cascading Style Sheets.
        It is used to style and design HTML web pages.
    </p>

    <p>
        CSS helps us change colors, fonts, spacing,
        and the layout of a webpage.
    </p>

</body>
</html>
