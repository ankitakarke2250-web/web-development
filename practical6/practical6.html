
<!DOCTYPE html>
<html>
<head>
    <title>CSS Font Properties</title>

    <style>
        h1 {
            font-family: Arial, sans-serif;
            font-size: 36px;
            font-weight: bold;
            font-style: normal;
            text-align: center;
            color: blue;
        }

        .p1 {
            font-family: "Times New Roman", serif;
            font-size: 20px;
            font-weight: bold;
            color: green;
        }

        .p2 {
            font-family: Arial, sans-serif;
            font-size: 18px;
            font-style: italic;
            color: red;
        }

        .p3 {
            font-family: Verdana, sans-serif;
            font-size: 18px;
            text-decoration: underline;
            color: purple;
        }

        .p4 {
            font-size: 20px;
            text-transform: uppercase;
            color: brown;
        }
    </style>
</head>

<body>

    <h1>CSS Font Properties</h1>

    <p class="p1">This text is bold using Times New Roman.</p>

    <p class="p2">This text is italic using Arial.</p>

    <p class="p3">This text is underlined using Verdana.</p>

    <p class="p4">this text is transformed to uppercase.</p>

</body>
</html>
