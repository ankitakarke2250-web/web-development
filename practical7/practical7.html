
<!DOCTYPE html>
<html>
<head>
    <title>Borders, Margins and Padding</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>CSS Box Model</h1>

    <div class="box1">
        <h2>Solid Border</h2>
        <p>This box uses a solid border, margin, and padding.</p>
    </div>

    <div class="box2">
        <h2>Dashed Border</h2>
        <p>This box uses a dashed border, margin, and padding.</p>
    </div>

    <div class="box3">
        <h2>Dotted Border</h2>
        <p>This box uses a dotted border, margin, and padding.</p>
    </div>

</body>
</html>
