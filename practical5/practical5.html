
<!DOCTYPE html>
<html>
<head>
    <title>Background Colors and Images</title>

    <style>
        body {
            background-color: lightblue;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        h1 {
            color: darkblue;
            background-color: lightyellow;
            padding: 15px;
        }

        p {
            color: white;
            background-color: darkgreen;
            padding: 15px;
            font-size: 18px;
        }

        .image-section {
            background-image: url("bk.avif");
            background-size: cover;
            background-position: center;
            padding: 60px;
            color: white;
        }
    </style>
</head>

<body>

    <h1>Welcome to My Webpage</h1>

    <p>This paragraph has a green background color.</p>

    <div class="image-section">
        <h2>Background Image Section</h2>
        <p>CSS makes webpages attractive and colorful.</p>
    </div>

</body>
</html>
